[package]
name = "obd2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-agnostic OBD-II diagnostics and vehicle pack access"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
